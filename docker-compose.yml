services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: valpob
      POSTGRES_USER: valpob
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valpob -d valpob"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://valpob:${DB_PASSWORD}@db:5432/valpob
    ports:
      - "${PUERTO:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos_postgres:
